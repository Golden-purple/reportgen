name: CI

on:
  push:
    branches: [main, agent]
  pull_request:
  workflow_dispatch:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check server.js && node --check app.js
      - run: npm test

  engine:
    name: Engine unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v

  smoke:
    name: Engine image and end-to-end smoke test
    needs: [backend, engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - uses: docker/setup-buildx-action@v3
      # Build only; nothing is pushed. The GitHub Actions cache keeps the large TeX Live
      # layers between runs, so later builds take minutes instead of rebuilding everything.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: reportgen-engine:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash ci/smoke.sh
