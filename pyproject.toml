[project]
name = "reportgen"
version = "0.1.0"
description = "CLI tool to generate PDF reports from existing code"
authors = [{ name = "Golden Purple" }]
readme = "README.md"
requires-python = ">=3.9"

dependencies = []

[project.scripts]
reportgen = "reportgen.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"