[tool.setuptools]
packages = ["reportgen"]
[project]
name = "reportgen"
version = "0.1.0"
license = "MIT"
description = "CLI tool to generate PDF reports from existing code"
authors = [{ name = "Golden Purple" }]
readme = "README.md"
requires-python = ">=3.9"

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
reportgen = "reportgen.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"